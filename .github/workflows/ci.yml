name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # starts the soak job by hand

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (toolchain input = stable)
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
      - name: Core must not depend on gpui
        run: |
          cargo tree -p navigator-core -e all --all-features --target all --prefix none > core-tree.txt
          if grep -i gpui core-tree.txt; then echo "navigator-core depends on gpui"; exit 1; fi

  test:
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (toolchain input = stable)
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libzstd-dev libvulkan1
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  size:
    # Linux x64 release size gate (ADR 0004). Other targets get a gate after their first build.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      MAX_BYTES: "37317165" # 33 924 696 B measured on 2026-11-11, + 10%
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (toolchain input = stable)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Linux packages
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libzstd-dev libvulkan1
      - run: cargo build --release -p navigator-app
      - name: Check the binary size
        run: |
          size=$(stat -c %s target/release/mqtt-navigator)
          echo "mqtt-navigator: $size bytes (limit $MAX_BYTES)"
          test "$size" -le "$MAX_BYTES"

  broker-tests:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (toolchain input = stable)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: tests/broker/up.sh
      # Each test has its own topics and client IDs, and a RwLock keeps the restart tests apart.
      - run: cargo test -p navigator-core --features broker-tests --test net_mosquitto --test broker_matrix --test broker_compat --test net_keepalive_tasks --test net_system_ca
      - run: cargo test -p navigator-app --features broker-tests gui_round_trip
      - name: Load test (10 000 msg/s)
        env:
          LOAD_WARMUP_SECS: 15
          LOAD_SECS: 60
        run: cargo test --release -p navigator-core --features broker-tests --test load_ci -- --nocapture
      - name: Stop the broker
        if: always()
        run: tests/broker/down.sh

  # Runs on push to main, not on pull requests.
  fuzz:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (toolchain input = nightly)
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      # rust-cache keeps ${CARGO_HOME}/bin by default (`cache-bin`), so a later run restores the
      # installed cargo-fuzz and `cargo install` ends at once when the binary is up to date.
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz each target (20 s for the small input spaces, 60 s for the others)
        working-directory: fuzz
        run: |
          for spec in decode_render:60 parse_hex:20 topic_matches:20 profile_import:60; do
            cargo +nightly fuzz run "${spec%%:*}" -- -max_total_time="${spec##*:}"
          done
      - name: Keep the crash input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  # Runs only by hand (Actions > CI > Run workflow). One hour at 500 msg/s with 6 broker restarts (P7).
  soak:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (toolchain input = stable)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: tests/broker/up.sh mosquitto
      - name: Soak test (1 h)
        env:
          SOAK_SECS: 3600
          SOAK_RATE: 500
        run: cargo test --release -p navigator-core --features broker-tests --test soak -- --ignored --nocapture
      - name: Stop the broker
        if: always()
        run: tests/broker/down.sh
