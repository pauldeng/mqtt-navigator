name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly: the fuzz job
    - cron: "43 2 * * *" # nightly: the soak job
  workflow_dispatch: # starts the soak job by hand

concurrency:
  # The schedule is in the group, so that the weekly fuzz run does not cancel the nightly soak run.
  group: ci-${{ github.ref }}-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (toolchain input = stable)
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - name: Core must not depend on gpui
        run: |
          cargo tree -p navigator-core -e all --all-features --target all --prefix none > core-tree.txt
          if grep -i gpui core-tree.txt; then echo "navigator-core depends on gpui"; exit 1; fi

  test:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (toolchain input = stable)
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libzstd-dev libvulkan1
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  size:
    # Linux x64 release size gate (ADR 0004). Other targets get a gate after their first build.
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      MAX_BYTES: "37317165" # 33 924 696 B measured on 2026-11-11, + 10%
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (toolchain input = stable)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Linux packages
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libzstd-dev libvulkan1
      - run: cargo build --release -p navigator-app
      - name: Check the binary size
        run: |
          size=$(stat -c %s target/release/mqtt-navigator)
          echo "mqtt-navigator: $size bytes (limit $MAX_BYTES)"
          test "$size" -le "$MAX_BYTES"

  broker-tests:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (toolchain input = stable)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: tests/broker/up.sh
      - run: cargo test -p navigator-core --features broker-tests --test broker_matrix --test broker_compat -- --test-threads=1
      - name: Load test (10 000 msg/s)
        env:
          LOAD_WARMUP_SECS: 30
          LOAD_SECS: 120
        run: cargo test --release -p navigator-core --features broker-tests --test load_ci -- --nocapture
      - name: Stop the broker
        if: always()
        run: tests/broker/down.sh

  # Runs on push to main and every week, not on pull requests.
  fuzz:
    if: github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch' && github.event.schedule != '43 2 * * *'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (toolchain input = nightly)
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz each target for 60 s
        working-directory: fuzz
        run: |
          for target in decode_render parse_hex topic_matches profile_import; do
            cargo fuzz run "$target" -- -max_total_time=60
          done
      - name: Keep the crash input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  # Runs every night and by hand. One hour at 500 msg/s with 6 broker restarts (P7).
  soak:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '43 2 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (toolchain input = stable)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: tests/broker/up.sh mosquitto
      - name: Soak test (1 h)
        env:
          SOAK_SECS: 3600
          SOAK_RATE: 500
        run: cargo test --release -p navigator-core --features broker-tests --test soak -- --ignored --nocapture
      - name: Stop the broker
        if: always()
        run: tests/broker/down.sh
