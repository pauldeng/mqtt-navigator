# Test broker. Ports are the same inside the container and on 127.0.0.1.
per_listener_settings true
log_dest stdout

# 18830: anonymous TCP
listener 18830
allow_anonymous true

# 18831: TCP with user name and password
listener 18831
allow_anonymous false
password_file /certs/passwd

# 18832: TLS
listener 18832
allow_anonymous true
cafile /certs/ca.crt
certfile /certs/server.crt
keyfile /certs/server.key

# 18833: mutual TLS
listener 18833
allow_anonymous true
cafile /certs/ca.crt
certfile /certs/server.crt
keyfile /certs/server.key
require_certificate true

# 18834: WebSocket
listener 18834
protocol websockets
allow_anonymous true

# 18835: secure WebSocket
listener 18835
protocol websockets
allow_anonymous true
cafile /certs/ca.crt
certfile /certs/server.crt
keyfile /certs/server.key

# 18836: TLS with an expired server certificate
listener 18836
allow_anonymous true
cafile /certs/ca.crt
certfile /certs/expired.crt
keyfile /certs/expired.key

# 18837: TLS with a server certificate for another host name
listener 18837
allow_anonymous true
cafile /certs/ca.crt
certfile /certs/wrong-host.crt
keyfile /certs/wrong-host.key
