# Second Mosquitto: the limits that Mosquitto sets for the whole broker, not for one listener
# (max_keepalive, max_inflight_messages, max_packet_size).
# Ports are the same inside the container and on 127.0.0.1.
per_listener_settings true
log_dest stdout
# The broker answers a keep alive above 5 s with Server Keep Alive 5 (MQTT 5).
max_keepalive 5
# The broker announces Receive Maximum 2 in CONNACK (MQTT 5).
max_inflight_messages 2
# The broker announces Maximum Packet Size 4096 in CONNACK (MQTT 5).
max_packet_size 4096

# 18860: anonymous TCP
listener 18860
allow_anonymous true
