[workspace]
resolver = "3"
members = ["crates/navigator-core", "crates/navigator-app", "crates/navigator-update"]
exclude = ["fuzz"]
default-members = ["crates/navigator-app"]

[workspace.package]
version = "0.2.6"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pauldeng/mqtt-navigator"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

# Dev builds: full debug info for our crates only. gpui's debug info is several GB.
[profile.dev.package."*"]
debug = false

# Chosen by measurement (ADR 0004): level 3 uses less UI CPU for each frame than "s". CI has no binary size gate.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = "line-tables-only"
split-debuginfo = "packed"  # symbols go to a separate file for crash analysis
# panic stays "unwind": a library panic must stop one session, not the app.
